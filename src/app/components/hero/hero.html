<section class="hero">
  <div class="hero-background">
    <div class="hero-overlay"></div>
  </div>
  <div class="hero-content">
    <div class="container">
      <h1 class="hero-title">{{ cafeInfo.name }}</h1>
      <p class="hero-tagline">{{ cafeInfo.tagline }}</p>
      <p class="hero-description">
        Descubre el auténtico sabor del café ecuatoriano, seleccionado de las mejores regiones del país.
      </p>
      <div class="hero-buttons">
        <a (click)="scrollToSection('coffee')" class="btn btn-primary">Nuestros Cafés</a>
        <a (click)="scrollToSection('contact')" class="btn btn-outline">Visítanos</a>
      </div>
    </div>
  </div>
  <div class="hero-scroll">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 13L12 18L17 13M7 6L12 11L17 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</section>
