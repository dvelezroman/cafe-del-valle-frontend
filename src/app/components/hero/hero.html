<section class="hero" id="home">
  <div class="hero-bg-container">
    <div class="hero-image"></div>
    <div class="hero-overlay"></div>
  </div>

  <div class="container hero-container">
    <div class="hero-content glass-card">
      <header class="hero-header">
        <span class="hero-subtitle animate-fade-in">{{ translate('hero.tagline') }}</span>
        <h1 class="hero-title animate-title">
          {{ translate('hero.title') || 'Café del Valle' }}
        </h1>
      </header>
      
      <div class="hero-body animate-fade-in--delayed">
        <p class="hero-description">
          {{ translate('hero.description') }}
        </p>
        
        <div class="hero-actions">
          <button (click)="scrollToSection('coffee')" class="btn btn-primary" aria-label="Ver variedades de café">
            {{ translate('hero.button.coffee') }}
          </button>
          <button (click)="scrollToSection('menu')" class="btn btn-outline" aria-label="Ver el menú">
            {{ translate('hero.button.menu') || 'Ver Menú' }}
          </button>
        </div>
      </div>
    </div>

    <button type="button"
            class="scroll-indicator"
            (click)="scrollToSection('about')"
            [attr.aria-label]="translate('hero.scrollAria')">
      <span class="scroll-text" aria-hidden="true">{{ translate('hero.scroll') || 'Descubre más' }}</span>
      <div class="scroll-icon">
        <div class="dot"></div>
      </div>
    </button>
  </div>
</section>
