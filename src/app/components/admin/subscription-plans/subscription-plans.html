<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Subscription Plans</h2>
        <button (click)="openModal()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark">
            + New Plan
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (plan of plans(); track plan.id) {
        <div class="bg-white rounded-lg shadow-md p-6 border border-gray-100">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-xl font-bold text-gray-800">{{ plan.title.es }}</h3>
                <span [class]="plan.active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                    class="px-2 py-1 rounded-full text-xs font-medium">
                    {{ plan.active ? 'Active' : 'Inactive' }}
                </span>
            </div>
            <p class="text-gray-600 mb-4">{{ plan.description.es }}</p>
            <div class="text-2xl font-bold text-primary mb-4">${{ plan.price }}</div>

            <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-gray-100">
                <button (click)="openModal(plan)" class="text-blue-600 hover:text-blue-800">Edit</button>
                <button (click)="deletePlan(plan.id)" class="text-red-600 hover:text-red-800 ml-4">Delete</button>
            </div>
        </div>
        }
    </div>

    <!-- Modal -->
    @if (isModalOpen()) {
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-6">{{ editingPlan() ? 'Edit Plan' : 'New Plan' }}</h3>

            <form (ngSubmit)="savePlan()" class="space-y-4">
                <!-- Title -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Title (ES)</label>
                        <input [(ngModel)]="formData().title.es" name="titleEs" type="text"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Title (EN)</label>
                        <input [(ngModel)]="formData().title.en" name="titleEn" type="text"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                </div>

                <!-- Description -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description (ES)</label>
                        <textarea [(ngModel)]="formData().description.es" name="descEs" rows="2"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description (EN)</label>
                        <textarea [(ngModel)]="formData().description.en" name="descEn" rows="2"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
                    </div>
                </div>

                <!-- Price & Order -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Price</label>
                        <input [(ngModel)]="formData().price" name="price" type="number" step="0.01"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Order</label>
                        <input [(ngModel)]="formData().order" name="order" type="number"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                </div>

                <!-- Features -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Features (ES) - One per line</label>
                        <textarea [(ngModel)]="formData().featuresInputEs" name="featEs" rows="4"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Features (EN) - One per line</label>
                        <textarea [(ngModel)]="formData().featuresInputEn" name="featEn" rows="4"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
                    </div>
                </div>

                <div class="flex items-center">
                    <input [(ngModel)]="formData().active" name="active" type="checkbox"
                        class="h-4 w-4 text-primary border-gray-300 rounded">
                    <label class="ml-2 block text-sm text-gray-900">Active</label>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" (click)="closeModal()"
                        class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark">Save</button>
                </div>
            </form>
        </div>
    </div>
    }
</div>
