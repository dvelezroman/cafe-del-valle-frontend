<div class="login-container">
    <div class="login-card glass-card">
        <div class="login-header">
            <img src="/images/Logo2.jpeg" alt="Café del Valle" class="login-logo" />
            <h2>Panel Administrativo</h2>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <form (submit)="onSubmit($event)" class="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="admin@ejemplo.com" required
                    autocomplete="email" />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••"
                    required autocomplete="current-password" />
            </div>

            @if (error) {
            <div class="login-error">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            }

            <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
                @if (loading) {
                <span class="spinner"></span>
                Ingresando...
                } @else {
                Iniciar Sesión
                }
            </button>
        </form>

        <div class="login-footer">
            <a href="/" class="back-link">← Volver al sitio</a>
        </div>
    </div>
</div>
