<div class="login-container" role="main" aria-label="Página de inicio de sesión">
    <div class="login-card glass-card">
        <div class="login-header">
            <img src="/images/Logo2.jpeg" alt="Café del Valle - Logo" class="login-logo" />
            <h1>Panel Administrativo</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <form (submit)="onSubmit($event)" 
              class="login-form"
              [attr.aria-invalid]="error ? 'true' : 'false'"
              [attr.aria-describedby]="error ? 'login-error' : null"
              novalidate>
            <div class="form-group">
                <label for="email">Correo Electrónico <span class="required" aria-label="requerido">*</span></label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       [(ngModel)]="email" 
                       placeholder="admin@ejemplo.com" 
                       required
                       autocomplete="email"
                       [attr.aria-required]="true"
                       [attr.aria-invalid]="error && !email ? 'true' : 'false'"
                       aria-describedby="email-help" />
                <small id="email-help" class="sr-only">Ingresa tu dirección de correo electrónico</small>
            </div>

            <div class="form-group">
                <label for="password">Contraseña <span class="required" aria-label="requerido">*</span></label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       [(ngModel)]="password" 
                       placeholder="••••••••"
                       required 
                       autocomplete="current-password"
                       [attr.aria-required]="true"
                       [attr.aria-invalid]="error && !password ? 'true' : 'false'"
                       aria-describedby="password-help" />
                <small id="password-help" class="sr-only">Ingresa tu contraseña</small>
            </div>

            @if (error) {
            <div class="login-error" 
                 id="login-error"
                 role="alert"
                 aria-live="assertive">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            }

            <button type="submit" 
                    class="btn btn-primary btn-block" 
                    [disabled]="loading"
                    [attr.aria-busy]="loading">
                @if (loading) {
                <span class="spinner" aria-hidden="true"></span>
                <span>Ingresando...</span>
                } @else {
                Iniciar Sesión
                }
            </button>
        </form>

        <div class="login-footer">
            <a href="/" class="back-link" aria-label="Volver al sitio principal de Café del Valle">
                <span aria-hidden="true">←</span> Volver al sitio
            </a>
        </div>
    </div>
</div>
