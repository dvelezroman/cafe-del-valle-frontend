<aside class="sidebar" 
       [class.open]="isOpen()"
       [attr.aria-hidden]="!isOpen()"
       [attr.aria-label]="'Navegación principal del panel de administración'"
       id="sidebar-navigation"
       role="navigation"
       #sidebar>
    <div class="sidebar-brand">
        <div class="logo-wrapper">
            <img src="/images/Logo2.jpeg" alt="Café del Valle - Logo" />
        </div>
        <span>Admin Central</span>
    </div>

    <nav class="sidebar-nav" aria-label="Menú de administración">
        <ul role="list">
            <li>
                <a routerLink="info" 
                   routerLinkActive="active" 
                   #infoLink="routerLinkActive"
                   (click)="close()"
                   #firstLink
                   [attr.aria-current]="infoLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <span>Información General</span>
                </a>
            </li>
            <li>
                <a routerLink="menu" 
                   routerLinkActive="active" 
                   #menuLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="menuLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span>Gestión del Menú</span>
                </a>
            </li>
            <li>
                <a routerLink="blog" 
                   routerLinkActive="active" 
                   #blogLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="blogLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span>Blog / Noticias</span>
                </a>
            </li>
            <li>
                <a routerLink="partners" 
                   routerLinkActive="active" 
                   #partnersLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="partnersLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Solicitudes Socios</span>
                </a>
            </li>
            <li>
                <a routerLink="club" 
                   routerLinkActive="active" 
                   #clubLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="clubLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polyline points="20 12 20 22 4 22 4 12"></polyline>
                        <rect x="2" y="7" width="20" height="5"></rect>
                        <line x1="12" y1="22" x2="12" y2="7"></line>
                        <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                        <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                    </svg>
                    <span>Gestión del Club</span>
                </a>
            </li>
            <li>
                <a routerLink="subscriptions" 
                   routerLinkActive="active" 
                   #subscriptionsLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="subscriptionsLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    <span>Planes de Suscripción</span>
                </a>
            </li>
            <li>
                <a routerLink="leads" 
                   routerLinkActive="active" 
                   #leadsLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="leadsLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Intereses / Leads</span>
                </a>
            </li>
            <!-- New Subscriber Management Section -->
            <li>
                <a routerLink="qr-generator" 
                   routerLinkActive="active" 
                   #qrLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="qrLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="3" width="8" height="8" rx="1"></rect>
                        <rect x="13" y="3" width="8" height="8" rx="1"></rect>
                        <rect x="3" y="13" width="8" height="8" rx="1"></rect>
                        <rect x="13" y="13" width="8" height="8" rx="1"></rect>
                    </svg>
                    <span>Generar QR Codes</span>
                </a>
            </li>
            <li>
                <a routerLink="codes" 
                   routerLinkActive="active" 
                   #codesLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="codesLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Gestión de Códigos</span>
                </a>
            </li>
            <li>
                <a routerLink="subscribers" 
                   routerLinkActive="active" 
                   #subscribersLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="subscribersLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Suscriptores Activos</span>
                </a>
            </li>
            <li>
                <a routerLink="redemption" 
                   routerLinkActive="active" 
                   #redemptionLink="routerLinkActive"
                   (click)="close()"
                   [attr.aria-current]="redemptionLink.isActive ? 'page' : null">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                    <span>Canje Rápido</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="sidebar-footer">
        <a href="/" 
           class="visit-btn" 
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Ver sitio web de Café del Valle (se abre en nueva ventana)">
            <span>Ver Sitio Web</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" />
            </svg>
        </a>
    </div>
</aside>
