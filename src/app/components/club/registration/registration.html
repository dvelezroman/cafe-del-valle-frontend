<div class="registration-container">
    <div class="registration-card glass-card">
        <div class="header">
            <h2>Únete al Club de Café</h2>
            <p>Suscríbete para obtener café gratis y promociones exclusivas en Café del Valle.</p>
        </div>

        <form (submit)="onSubmit($event)" class="registration-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Nombre</label>
                    <input type="text" id="firstName" name="firstName" [(ngModel)]="data.firstName" required
                        placeholder="Juan" />
                </div>
                <div class="form-group">
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName" name="lastName" [(ngModel)]="data.lastName" required
                        placeholder="Pérez" />
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="data.email" required
                    placeholder="juan@ejemplo.com" />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="data.password" required
                    placeholder="••••••••" minlength="8" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="idNumber">Cédula / ID</label>
                    <input type="text" id="idNumber" name="idNumber" [(ngModel)]="data.idNumber" required
                        placeholder="1310000000" />
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="phone" [(ngModel)]="data.phone" required
                        placeholder="+593 99 999 9999" />
                </div>
            </div>

            <div class="form-group">
                <label for="referralCode">Código de Referido (Opcional)</label>
                <input type="text" id="referralCode" name="referralCode" [(ngModel)]="data.referralCode"
                    placeholder="ABC123XY" />
                <small class="hint">Si alguien te invitó, ingresa su código para que gane puntos.</small>
            </div>

            @if (error) {
            <div class="feedback error">{{ error }}</div>
            }
            @if (success) {
            <div class="feedback success">{{ success }}</div>
            }

            <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
                @if (loading) {
                <span class="spinner"></span> Procesando...
                } @else {
                Enviar Solicitud
                }
            </button>
        </form>

        <div class="footer">
            <p>¿Ya eres socio? <a routerLink="/admin/login">Inicia sesión aquí</a></p>
        </div>
    </div>
</div>
