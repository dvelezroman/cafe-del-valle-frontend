<div class="partner-layout">
    <aside class="partner-sidebar">
        <div class="brand">
            <img src="/images/Logo2.jpeg" alt="Café del Valle" />
            <span>Club Café</span>
        </div>
        <nav>
            <ul>
                <li><a routerLink="dashboard" routerLinkActive="active">Inicio</a></li>
                <li><a routerLink="history" routerLinkActive="active">Mi Actividad</a></li>
            </ul>
        </nav>
        <div class="footer">
            <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
        </div>
    </aside>

    <main class="partner-content">
        <header class="content-header">
            <div class="user-info">
                <span class="name">{{ user?.name }}</span>
                <span class="role-badge">Socio Gold</span>
            </div>
        </header>
        <div class="view-container">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
